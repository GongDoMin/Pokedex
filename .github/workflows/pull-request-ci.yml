        - name: Generate markdown report for artifact notice
          id: generate_report
          if: steps.screenshotsverify.outcome == 'failure'
          run: |
            REPORT="## 📸 스크린샷 비교 결과\n\n"
            REPORT+="🔍 변경된 UI가 감지되었습니다.\n\n"
            REPORT+="비교된 스크린샷은 아래 GitHub Actions Artifacts에 업로드되어 있습니다.\n"
            REPORT+="➡️ [Artifacts 확인하기](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})\n"

            EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
            echo "report<<$EOF" >> $GITHUB_OUTPUT
            echo -e "$REPORT" >> $GITHUB_OUTPUT
            echo "$EOF" >> $GITHUB_OUTPUT

            echo "found_images=true" >> $GITHUB_OUTPUT

        - name: Find existing comment
          uses: peter-evans/find-comment@v3
          id: find_comment
          if: steps.generate_report.outputs.found_images == 'true'
          with:
            issue-number: ${{ github.event.pull_request.number }}
            comment-author: 'github-actions[bot]'
            body-includes: '## 📸 스크린샷 비교 결과'

        - name: Create or update comment with comparison results
          uses: peter-evans/create-or-update-comment@v4
          if: steps.generate_report.outputs.found_images == 'true'
          with:
            comment-id: ${{ steps.find_comment.outputs.comment-id }}
            issue-number: ${{ github.event.pull_request.number }}
            body: ${{ steps.generate_report.outputs.report }}
            edit-mode: replace
