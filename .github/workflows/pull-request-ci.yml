name: Pull Request CI

on:
  pull_request:
    branches:
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  checks: write
  pull-requests: write
  contents: write

jobs:
  build_test_lint:
    name: "Unit Test and Lint"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run local unit tests
        run: ./gradlew testDebugUnitTest

      - name: Check lint
        run: ./gradlew lintDebug

      - name: Upload JVM local test results (XML)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: local-test-results
          path: '**/build/test-results/test*UnitTest/TEST-*.xml'

      - name: Upload lint reports (HTML)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports-html
          path: '**/build/reports/lint-results-debug.html'

  androidTest:
    name: "Instrumentation Tests"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: run tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel
          script: ./gradlew connectedDebugAndroidTest

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: Android Test Results
          path: "**/outputs/androidTest-results/connected/**/*.xml"

  verify_screenshots:
      name: "verify screen"
      runs-on: ubuntu-latest

      steps:
        - name: Checkout the code
          uses: actions/checkout@v4

        - name: Gradle cache
          uses: actions/cache@v4
          with:
            path: |
              ~/.gradle/caches
              ~/.gradle/wrapper
            key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
            restore-keys: |
              ${{ runner.os }}-gradle-

        - name: Set up JDK 17
          uses: actions/setup-java@v4
          with:
            java-version: '17'
            distribution: 'temurin'

        - name: Set up Android SDK
          uses: android-actions/setup-android@v3

        - name: Grant execute permission for gradlew
          run: chmod +x gradlew

        # 레퍼런스 이미지만 별도의 브랜치에서 가져오기
        - name: Download reference screenshots from screenshots-main
          run: |
            git fetch origin screenshots-main
            git checkout origin/screenshots-main -- feature/src/screenshots/

        - name: Verify Roborazzi Screenshots
          id: screenshotsverify
          continue-on-error: true
          run: ./gradlew verifyRoborazziDebug

        - name: Generate new screenshots if verification failed
          id: screenshotsrecord
          if: steps.screenshotsverify.outcome == 'failure'
          run: ./gradlew recordRoborazziDebug

        - name: Push new screenshots if available
          uses: stefanzweifel/git-auto-commit-action@v5
          if: steps.screenshotsrecord.outcome == 'success'
          with:
            branch: screenshots-main
            file_pattern: 'feature/src/screenshots/*.png'
            disable_globbing: false
            commit_message: "스크린샷 자동 커밋"
            push_options: '--force'

        - name: Store reference images as artifacts
          uses: actions/upload-artifact@v4
          with:
            name: reference-screenshots
            path: "feature/build/outputs/screenshots_comparison/*_compare.png"
            retention-days: 30

